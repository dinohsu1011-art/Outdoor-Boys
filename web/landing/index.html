<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Outdoor Boys — Guided River Tracing · Nan'ao, Yilan</title>
<meta name="description" content="English-first guided river tracing (溯溪) from Nan'ao, Yilan. A small founder-led outfit running Taiwan's jade canyons."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonts-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,700;1,9..144,300;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:       #ffffff;
    --paper-deep:  #f5f5f3;
    --paper-warm:  #fafaf8;
    --ink:         #0f1a18;
    --ink-body:    #1f2b27;
    --mute:        #6b7570;
    --rule:        #d8ddd9;
    --rule-fine:   #e6ebe7;
    --river:       #0f3d5c;
    --clay:        #a8471f;
    --moss:        #4a5c1e;

    --bg: var(--paper);
    --fg: var(--ink);
    --fg-soft: var(--ink-body);
    --accent: var(--clay);
    --accent-2: var(--river);
    --panel: var(--paper-warm);
    --line-c: var(--rule);

    --display: 'Fraunces', 'Noto Serif TC', Georgia, serif;
    --body:    'Inter', 'Noto Sans TC', system-ui, sans-serif;
    --mono:    'JetBrains Mono', ui-monospace, monospace;
    --zh:      'Noto Serif TC', serif;
  }
  html[data-theme="dark"]{
    --paper:       #0f1a18;
    --paper-deep:  #152320;
    --paper-warm:  #13201d;
    --ink:         #e4ede4;
    --ink-body:    #c9d6cd;
    --mute:        #8a9b91;
    --rule:        rgba(174,194,180,.22);
    --rule-fine:   rgba(174,194,180,.15);
    --river:       #7fb4d0;
    --clay:        #e07a45;
    --bg:var(--paper); --fg:var(--ink); --fg-soft:var(--ink-body);
    --accent:var(--clay); --accent-2:var(--river);
    --panel: var(--paper-deep); --line-c:var(--rule);
  }
  html[data-palette="river"]{ --clay: #0f3d5c; --accent: var(--clay); }
  html[data-palette="moss"]{  --clay: #4a5c1e; --accent: var(--clay); }
  html[data-palette="rust"]{  --clay: #8a3414; --accent: var(--clay); }

  html[data-fonts="sans"]   { --display: 'Inter', system-ui, sans-serif; }
  html[data-fonts="mono-display"] { --display: 'JetBrains Mono', monospace; }

  /* EN / ZH toggle */
  html[lang="en"] .zh-only { display:none !important; }
  html[lang="zh"] .en-only { display:none !important; }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--fg-soft);
    font-family:var(--body); font-size:16px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
    font-feature-settings: "kern", "liga", "ss01";
  }
  body{ overflow-x:hidden; position:relative;
    transition: background .35s ease, color .35s ease; }

  /* clean white — no texture */
  body::before{ display:none; }
  body::after{ display:none; }

  #root{ position:relative; z-index:2; }

  h1,h2,h3,h4{ font-family:var(--display); font-weight:500; color:var(--fg); letter-spacing:-0.015em; line-height:1.1; margin:0; }
  p{ margin:0; max-width: 62ch; }
  a{ color:inherit; text-decoration-color: var(--line-c); text-underline-offset:3px; }

  .mono{ font-family:var(--mono); font-size:12px; letter-spacing:.08em; color:var(--mute); text-transform:uppercase; font-variant-numeric:tabular-nums; }
  .zh{ font-family:var(--zh); }

  .reveal{ opacity:0; transform: translateY(18px); transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1); }
  .reveal.in{ opacity:1; transform:none; }
  .stagger > *{ opacity:0; transform: translateY(14px); transition: opacity .75s ease, transform .75s ease; }
  .stagger.in > *{ opacity:1; transform:none; }
  .stagger.in > *:nth-child(1){ transition-delay:0ms; }
  .stagger.in > *:nth-child(2){ transition-delay:70ms; }
  .stagger.in > *:nth-child(3){ transition-delay:140ms; }
  .stagger.in > *:nth-child(4){ transition-delay:210ms; }
  .stagger.in > *:nth-child(5){ transition-delay:280ms; }
  .stagger.in > *:nth-child(6){ transition-delay:350ms; }

  ::selection{ background: var(--clay); color: var(--paper); }
</style>
</head>
<body>
<div id="root"></div>
