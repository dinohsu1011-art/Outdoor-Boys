<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Outdoor Boys</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0c1510;color:#c9d6cd;font-family:'Trebuchet MS','Calibri',sans-serif}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px}
  .wrap{max-width:480px;width:100%}
  .logo{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#5a7a64;margin-bottom:40px}
  h1{font-size:clamp(36px,7vw,64px);font-weight:700;line-height:.95;color:#e4ede4;margin-bottom:28px;letter-spacing:-0.02em}
  .links{display:flex;flex-direction:column;gap:4px;margin-top:48px}
  .link-item{display:flex;align-items:baseline;gap:16px;padding:16px 0;border-top:1px solid rgba(174,194,180,.15);text-decoration:none;color:inherit;transition:color .2s}
  .link-item:hover{color:#e4ede4}
  .link-item:hover .arrow{transform:translateX(4px)}
  .link-num{font-size:11px;letter-spacing:.1em;color:#3d5a47;flex-shrink:0;font-variant-numeric:tabular-nums}
  .link-body{flex:1}
  .link-title{font-size:18px;font-weight:600;color:#c9d6cd;margin-bottom:2px;transition:color .2s}
  .link-item:hover .link-title{color:#e4ede4}
  .link-sub{font-size:13px;color:#5a7a64}
  .arrow{font-size:16px;color:#3d5a47;transition:transform .2s}
  .tag{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border:1px solid rgba(174,194,180,.2);border-radius:2px;color:#5a7a64;margin-left:8px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Outdoor Boys · Nan'ao, Yilan</div>
  <h1>Where<br>do you<br>want to go?</h1>

  <nav class="links">
    <a class="link-item" href="landing/">
      <span class="link-num">01</span>
      <span class="link-body">
        <div class="link-title">Public Landing Page <span class="tag">Live</span></div>
        <div class="link-sub">Customer-facing site — river tracing, guided trips</div>
      </span>
      <span class="arrow">→</span>
    </a>
    <a class="link-item" href="dashboard/">
      <span class="link-num">02</span>
      <span class="link-body">
        <div class="link-title">Ops Dashboard <span class="tag">Internal</span></div>
        <div class="link-sub">Regulatory research, certifications, business plan</div>
      </span>
      <span class="arrow">→</span>
    </a>
  </nav>
</div>
</body>
</html>
